<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trimly</title>
<style>
  :root {
    --bg: #f3f4f8;
    --surface: #ffffff;
    --surface-2: #f0f1f6;
    --border: rgba(15, 20, 40, .08);
    --text: #141824;
    --muted: #646b80;
    --accent: #6d5efc;
    --accent-2: #2bb8f0;
    --good: #14a874;
    --track: #d6d9e4;
    --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 8px 24px rgba(16, 24, 40, .06);
    --glow: rgba(109, 94, 252, .16);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e0f13;
      --surface: #16181f;
      --surface-2: #1e2129;
      --border: rgba(255, 255, 255, .07);
      --text: #eceef4;
      --muted: #8a91a6;
      --accent: #8b7dff;
      --accent-2: #38c6f4;
      --good: #3ddc97;
      --track: #2c303c;
      --shadow: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 10px 30px rgba(0, 0, 0, .35);
      --glow: rgba(139, 125, 255, .18);
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    overflow: hidden;
  }
  /* Soft accent glow behind the header. */
  body::before {
    content: "";
    position: fixed;
    inset: -120px -60px auto;
    height: 300px;
    background: radial-gradient(60% 60% at 30% 40%, var(--glow), transparent 70%);
    pointer-events: none;
  }

  .app { position: relative; height: 100%; display: flex; flex-direction: column; }
  /* Thin edge so the borderless window reads as a window on any background. */
  .app::after {
    content: ""; position: fixed; inset: 0; z-index: 30; pointer-events: none;
    border: 1px solid var(--border);
  }

  /* Custom title bar: drag anywhere except the buttons. */
  .titlebar { height: 46px; display: flex; align-items: center; justify-content: space-between; padding-left: 16px; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .logo {
    flex: none; width: 26px; height: 26px; border-radius: 8px;
    display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 4px 14px var(--glow);
    color: #fff;
  }
  h1 { margin: 0; font: 600 14px/1 "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
  .ver { color: var(--muted); font-size: 12px; }
  .winbtns { align-self: stretch; display: flex; }
  .winbtns button {
    width: 46px; border: 0; background: none; color: var(--muted); cursor: default;
    display: grid; place-items: center; transition: background .15s, color .15s;
  }
  .winbtns button:hover { background: var(--surface-2); color: var(--text); }
  .winbtns .close:hover { background: #e81123; color: #fff; }
  .winbtns button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  body.inactive .titlebar h1, body.inactive .winbtns button { opacity: .55; }
  header .tabs { margin: 6px 20px 0; }

  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 11px 5px 9px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--border);
    font-size: 12px; color: var(--muted); white-space: nowrap;
    transition: color .3s;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); position: relative; transition: background .3s; }
  .pill.on { color: var(--text); }
  .pill.on .dot { background: var(--good); }
  .pill.on .dot::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: var(--good); animation: ping 2s cubic-bezier(0, 0, .2, 1) infinite;
  }
  @keyframes ping { 75%, 100% { transform: scale(2.6); opacity: 0; } }

  /* Segmented tabs with a sliding indicator. */
  .tabs {
    position: relative; display: grid; grid-template-columns: 1fr 1fr;
    padding: 4px; border-radius: 12px;
    background: var(--surface-2); border: 1px solid var(--border);
  }
  .tabs button {
    position: relative; z-index: 1; border: 0; background: none; color: var(--muted);
    font: 600 13px "Segoe UI", system-ui, sans-serif; padding: 8px 0; border-radius: 9px; cursor: pointer;
    transition: color .25s;
  }
  .tabs button[aria-selected="true"] { color: var(--text); }
  .tabs .ind {
    position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px);
    border-radius: 9px; background: var(--surface); box-shadow: var(--shadow);
    transition: transform .35s cubic-bezier(.3, .9, .3, 1);
  }
  .tabs[data-tab="settings"] .ind { transform: translateX(100%); }

  .panels { position: relative; flex: 1; min-height: 0; }
  .panel {
    position: absolute; inset: 0; overflow-y: auto; overflow-anchor: none; padding: 16px 20px 22px;
    transition: opacity .3s, transform .35s cubic-bezier(.3, .9, .3, 1);
  }
  .panel[hidden] { display: block; opacity: 0; pointer-events: none; transform: translateX(14px); }
  .panel.left[hidden] { transform: translateX(-14px); }
  .panel::-webkit-scrollbar { width: 10px; }
  .panel::-webkit-scrollbar-thumb { background: var(--track); border-radius: 10px; border: 3px solid var(--bg); }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    box-shadow: var(--shadow);
  }
  .rise { animation: rise .55s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i, 0) * 70ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }

  .label { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }

  /* Hero: live Discord RAM. */
  .hero { padding: 18px 18px 16px; overflow: hidden; }
  .hero-head { display: flex; justify-content: space-between; align-items: center; }
  .big { display: flex; align-items: baseline; gap: 6px; margin-top: 6px; }
  .big #ram {
    font: 700 46px/1 "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(135deg, var(--text) 30%, var(--accent));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .unit { font-weight: 600; color: var(--muted); font-size: 15px; }
  .sub { margin-top: 6px; font-size: 13px; color: var(--muted); min-height: 18px; transition: color .3s; }
  .sub.down { color: var(--good); }
  .chart { display: block; width: 100%; height: 90px; margin: 10px 0 14px; }
  .chart .line { fill: none; stroke: url(#stroke); stroke-width: 2.5; stroke-linecap: round; }
  .tip { fill: var(--surface); stroke: var(--accent); stroke-width: 2.5; }
  .chart-empty { font-size: 12px; fill: var(--muted); }

  .trim {
    position: relative; overflow: hidden; width: 100%; border: 0; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px; border-radius: 12px; color: #fff;
    font: 600 14px "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 8px 20px var(--glow);
    transition: transform .15s, box-shadow .25s, filter .25s;
  }
  .trim:hover { filter: brightness(1.06); box-shadow: 0 10px 26px var(--glow); }
  .trim:active { transform: scale(.98); }
  .trim:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .trim .shine {
    position: absolute; inset: 0; transform: translateX(-120%);
    background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, .35) 50%, transparent 70%);
  }
  .trim:hover .shine { animation: shine 1.1s ease; }
  @keyframes shine { to { transform: translateX(120%); } }
  .trim .spin { display: none; width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .4); border-top-color: #fff; animation: spin .7s linear infinite; }
  .trim.busy .spin { display: block; }
  .trim.busy .bolt { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .particle { position: fixed; width: 7px; height: 7px; border-radius: 50%; pointer-events: none; z-index: 10; }

  .big-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
  .side { text-align: right; font-size: 12px; color: var(--muted); line-height: 1.6; padding-bottom: 2px; }
  .side b { color: var(--text); font-size: 14px; font-variant-numeric: tabular-nums; }
  .hint { font-size: 12px; color: var(--muted); }

  /* Per-app rows on the Overview. */
  .apps { margin-top: 12px; }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 16px 4px; }
  .apps .row { padding: 10px 14px; transition: opacity .3s; }
  .apps .row.off { opacity: .5; }
  .apps .row + .row { border-top: 1px solid var(--border); }
  .apps .ram { flex: none; min-width: 70px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  .apps .ram small { color: var(--muted); font-weight: 600; font-size: 11px; margin-left: 3px; }
  .share { height: 4px; border-radius: 4px; background: var(--track); margin-top: 7px; overflow: hidden; }
  .share i {
    display: block; height: 100%; width: 0; border-radius: 4px;
    background: linear-gradient(90deg, var(--accent-2), var(--accent));
    transition: width .7s cubic-bezier(.3, .9, .3, 1);
  }
  .mini {
    flex: none; width: 32px; height: 32px; border: 0; border-radius: 9px; cursor: pointer;
    display: grid; place-items: center; background: var(--surface-2); color: var(--accent);
    transition: background .2s, color .2s, transform .15s;
  }
  .mini:hover:not(:disabled) { background: var(--accent); color: #fff; }
  .mini:active:not(:disabled) { transform: scale(.92); }
  .mini:disabled { color: var(--muted); cursor: default; opacity: .5; }
  .mini:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .mini.busy svg { animation: spin .7s linear infinite; }

  /* Settings tab. */
  h2 { margin: 18px 4px 8px; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
  h2:first-child { margin-top: 2px; }
  .list .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
  .list .row + .row { border-top: 1px solid var(--border); }
  .ico {
    flex: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
    background: var(--surface-2); color: var(--accent);
  }
  .row .txt { flex: 1; min-width: 0; }
  .row .t { font-weight: 600; font-size: 14px; }
  .row .d { font-size: 12px; color: var(--muted); margin-top: 1px; }

  .switch {
    flex: none; position: relative; width: 44px; height: 26px; border-radius: 999px; border: 0; cursor: pointer;
    background: var(--track); transition: background .25s;
  }
  .switch .knob {
    position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff;
    box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: transform .3s cubic-bezier(.3, 1.4, .5, 1);
  }
  .switch[aria-checked="true"] { background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
  .switch[aria-checked="true"] .knob { transform: translateX(18px); }
  .switch:active .knob { width: 24px; }
  .switch[aria-checked="true"]:active .knob { transform: translateX(14px); }
  .switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .stepper { flex: none; display: flex; align-items: center; gap: 2px; background: var(--surface-2); border-radius: 10px; padding: 3px; }
  .stepper button {
    width: 28px; height: 28px; border: 0; border-radius: 8px; background: none; color: var(--muted);
    font-size: 17px; line-height: 1; cursor: pointer; transition: background .15s, color .15s;
  }
  .stepper button:hover { background: var(--surface); color: var(--text); }
  .stepper input {
    width: 52px; border: 0; background: none; color: var(--text); text-align: center;
    font: 600 14px "Segoe UI", system-ui, sans-serif; font-variant-numeric: tabular-nums; user-select: text;
  }
  .stepper input:focus { outline: none; }
  .stepper:focus-within { box-shadow: 0 0 0 2px var(--accent); }
  .stepper input::-webkit-inner-spin-button { display: none; }
  .stepper .s { font-size: 12px; color: var(--muted); padding-right: 6px; }
  .saved { font-size: 11px; color: var(--good); opacity: 0; transition: opacity .3s; margin-left: 6px; }
  .saved.show { opacity: 1; }

  .foot { margin: 18px 4px 0; font-size: 12px; color: var(--muted); text-align: center; }

  /* Update banner and toast. */
  .banner {
    display: flex; align-items: center; gap: 12px; margin: 14px 20px 0; padding: 10px 10px 10px 14px;
    border-radius: 12px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff;
    animation: drop .5s cubic-bezier(.2, .8, .2, 1);
  }
  .banner[hidden] { display: none; }
  .banner .txt { flex: 1; font-weight: 600; font-size: 13px; }
  .banner button { border: 0; border-radius: 8px; padding: 7px 12px; background: rgba(255, 255, 255, .22); color: #fff; font: 600 13px "Segoe UI", system-ui, sans-serif; cursor: pointer; }
  .banner button:hover { background: rgba(255, 255, 255, .32); }
  .banner button:disabled { opacity: .7; cursor: default; }
  @keyframes drop { from { opacity: 0; transform: translateY(-8px); } }

  .toast {
    position: fixed; left: 50%; bottom: 18px; z-index: 20; display: flex; align-items: center; gap: 8px;
    padding: 10px 16px; border-radius: 12px; background: var(--text); color: var(--bg);
    font-weight: 600; font-size: 13px; box-shadow: 0 10px 30px rgba(0, 0, 0, .3);
    transform: translate(-50%, 30px); opacity: 0; pointer-events: none;
    transition: transform .4s cubic-bezier(.2, 1.2, .3, 1), opacity .3s;
  }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }
  .toast svg { color: var(--good); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="titlebar" id="titlebar">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
        </div>
        <h1 id="appName">Trimly</h1>
        <span class="ver" id="ver"></span>
      </div>
      <div class="winbtns">
        <button id="minBtn" aria-label="Minimize" title="Minimize">
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5h10" stroke="currentColor" stroke-width="1"/></svg>
        </button>
        <button id="closeBtn" class="close" aria-label="Close" title="Close">
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 0l10 10M10 0 0 10" stroke="currentColor" stroke-width="1"/></svg>
        </button>
      </div>
    </div>
    <div class="tabs" id="tabs" data-tab="overview" role="tablist">
      <span class="ind"></span>
      <button role="tab" id="tab-overview" aria-selected="true" aria-controls="overview">Overview</button>
      <button role="tab" id="tab-settings" aria-selected="false" aria-controls="settings">Settings</button>
    </div>
  </header>

  <div class="banner" id="update" hidden>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
    <span class="txt" id="updateText">A new version is ready</span>
    <button id="updateBtn">Install</button>
  </div>

  <div class="panels">
    <section class="panel left" id="overview" role="tabpanel" aria-labelledby="tab-overview">
      <div class="card hero rise" style="--i:0">
        <div class="hero-head">
          <span class="label">MEMORY IN USE</span>
          <span class="pill" id="status" role="status"><span class="dot"></span><span id="statusText">Starting</span></span>
        </div>
        <div class="big-row">
          <div class="big"><span id="ram">0</span><span class="unit">MB</span></div>
          <div class="side">
            <div><b id="freed">0</b> <span id="freedUnit">MB</span> freed</div>
            <div><b id="trims">0</b> trims run</div>
          </div>
        </div>
        <div class="sub" id="ramSub">Measuring</div>
        <svg class="chart" id="chart" aria-label="Memory of tracked apps over the last minute">
          <defs>
            <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="var(--accent)" stop-opacity=".32"/>
              <stop offset="1" stop-color="var(--accent)" stop-opacity="0"/>
            </linearGradient>
            <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="var(--accent-2)"/>
              <stop offset="1" stop-color="var(--accent)"/>
            </linearGradient>
          </defs>
          <g id="plot">
            <path id="area" fill="url(#fill)"/>
            <path id="line" class="line"/>
            <circle id="tip" class="tip" r="4.5" cx="-10" cy="-10"/>
          </g>
          <text id="empty" class="chart-empty" x="50%" y="55%" text-anchor="middle">Collecting samples</text>
        </svg>
        <button class="trim" id="trimBtn">
          <span class="shine"></span>
          <svg class="bolt" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
          <span class="spin" aria-hidden="true"></span>
          <span id="trimText">Trim all now</span>
        </button>
      </div>

      <div class="card list apps rise" style="--i:1">
        <div class="card-head"><span class="label">APPS</span><span class="hint">RAM now</span></div>
        <div id="apps"></div>
      </div>
    </section>

    <section class="panel" id="settings" role="tabpanel" aria-labelledby="tab-settings" hidden>
      <h2>Automation</h2>
      <div class="card list" id="features"></div>

      <h2>General</h2>
      <div class="card list">
        <div class="row">
          <span class="ico" aria-hidden="true" id="autostartIco"></span>
          <div class="txt"><div class="t">Start with Windows</div><div class="d">Run quietly in the tray when you sign in.</div></div>
          <button class="switch" role="switch" aria-checked="false" aria-label="Start with Windows" id="autostart"><span class="knob"></span></button>
        </div>
      </div>

      <h2>Timing</h2>
      <div class="card list" id="timings"></div>

      <p class="foot">Closing this window keeps Trimly running in the tray.</p>
    </section>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>
  <span id="toastText"></span>
</div>

<script>
const $ = (id) => document.getElementById(id);
const send = (msg) => window.ipc.postMessage(JSON.stringify(msg));
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

const svg = (body) =>
  `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;
const ICONS = {
  moon: svg('<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>'),
  monitor: svg('<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>'),
  gamepad: svg('<path d="M6 11h4M8 9v4M15 12h.01M18 10h.01"/><path d="M17.3 5H6.7a4 4 0 0 0-3.9 3.2L2 13.5A3 3 0 0 0 7.2 16L9 14h6l1.8 2a3 3 0 0 0 5.2-2.5l-.8-5.3A4 4 0 0 0 17.3 5z"/>'),
  keyboard: svg('<rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/>'),
  folder: svg('<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>'),
  leaf: svg('<path d="M11 20A7 7 0 0 1 4 13c0-6 7-9 16-9 0 9-3 16-9 16z"/><path d="M4 20c4-4 7-6 11-8"/>'),
  power: svg('<path d="M12 3v9"/><path d="M6.4 6.4a8 8 0 1 0 11.2 0"/>'),
  clock: svg('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
};

// Friendly names for the features the app reports, by config id.
const FEATURES = {
  discord_trim_idle: ["Trim when hidden", "Frees RAM once Discord has sat in the background a while.", "moon"],
  discord_trim_active: ["Trim while visible", "Keeps trimming when Discord is open on another monitor.", "monitor"],
  steam_trim_idle: ["Trim Steam when hidden", "Same idea for Steam and its web helper.", "gamepad"],
  ctf_trim_idle: ["Trim CTF Loader", "Trims ctfmon, the Windows text-input helper.", "keyboard"],
  explorer_trim_idle: ["Trim Windows Explorer", "Trims Explorer when you're idle, and on a timer.", "folder"],
  discord_eco_qos: ["Efficiency mode", "Lowers Discord's CPU priority while it's hidden.", "leaf"],
};

// Timing rows, in the order the app sends their values.
const TIMINGS = [
  ["Hidden delay", "Wait after Discord is hidden"],
  ["Hidden repeat", "Trim again while it stays hidden"],
  ["Visible repeat", "Trim visible Discord this often"],
  ["Explorer idle", "Trim after no input for"],
  ["Explorer repeat", "Trim Explorer this often"],
];

/* ---------- Numbers that count up or down ---------- */
function tween(el, to, fmt) {
  const from = el._shown ?? to;
  cancelAnimationFrame(el._raf);
  if (reduced || Math.abs(from - to) < 0.05) {
    el._shown = to;
    el.textContent = fmt(to);
    return;
  }
  const start = performance.now();
  const step = (now) => {
    const p = Math.min(1, (now - start) / 750);
    el._shown = from + (to - from) * (1 - Math.pow(1 - p, 3));
    el.textContent = fmt(el._shown);
    if (p < 1) el._raf = requestAnimationFrame(step);
  };
  el._raf = requestAnimationFrame(step);
}
const int = (v) => Math.round(v).toLocaleString();
const sizeParts = (mb) => (mb >= 1024 ? [(mb / 1024).toFixed(2), "GB"] : [int(mb), "MB"]);

/* ---------- Live chart: the last minute of samples, scrolling smoothly ---------- */
const SAMPLES = 60;
const history = [];
let peak = 0;

function smoothPath(pts) {
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}

function drawChart() {
  const chart = $("chart");
  const w = chart.clientWidth, h = chart.clientHeight;
  chart.setAttribute("viewBox", `0 0 ${w} ${h}`);
  $("empty").style.display = history.length < 2 ? "" : "none";
  if (history.length < 2) return;
  // Spread the samples over the full width until there is a minute of them, then scroll.
  const stepX = (w - 8) / (Math.max(history.length, 2) - 1);
  const max = Math.max(...history, 1) * 1.15;
  const pts = history.map((v, i) => [w - 8 - (history.length - 1 - i) * stepX, h - 4 - (v / max) * (h - 12)]);
  const line = smoothPath(pts);
  const last = pts[pts.length - 1];
  $("line").setAttribute("d", line);
  $("area").setAttribute("d", `${line} L${last[0]},${h} L${pts[0][0]},${h} Z`);
  $("tip").setAttribute("cx", last[0]);
  $("tip").setAttribute("cy", last[1]);
  // Once full, start one step to the right and glide into place, so the chart scrolls instead of jumping.
  const plot = $("plot");
  if (reduced || history.length < SAMPLES) return;
  plot.style.transition = "none";
  plot.style.transform = `translateX(${stepX}px)`;
  plot.getBoundingClientRect();
  plot.style.transition = "transform 1s linear";
  plot.style.transform = "translateX(0)";
}

/* ---------- Toggle switches ---------- */
const pending = {}; // id -> time of the user's last click, so a stale push doesn't flip it back
function setSwitch(btn, on) { btn.setAttribute("aria-checked", on ? "true" : "false"); }
function wireSwitch(btn, key, onToggle) {
  btn.addEventListener("click", () => {
    const on = btn.getAttribute("aria-checked") !== "true";
    setSwitch(btn, on);
    pending[key] = Date.now();
    onToggle(on);
  });
}
const fresh = (key) => !pending[key] || Date.now() - pending[key] > 1500;

let builtFeatures = "";
function renderFeatures(list) {
  const ids = list.map((f) => f.id).join();
  if (ids !== builtFeatures) {
    builtFeatures = ids;
    const box = $("features");
    box.innerHTML = "";
    for (const f of list) {
      const [title, desc, icon] = FEATURES[f.id] || [f.name, "", "clock"];
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `<span class="ico" aria-hidden="true">${ICONS[icon]}</span>
        <div class="txt"><div class="t"></div><div class="d"></div></div>
        <button class="switch" role="switch" aria-checked="false"><span class="knob"></span></button>`;
      row.querySelector(".t").textContent = title;
      row.querySelector(".d").textContent = desc;
      const btn = row.querySelector(".switch");
      btn.setAttribute("aria-label", title);
      btn.dataset.id = f.id;
      wireSwitch(btn, f.id, (on) => send({ cmd: "feature", id: f.id, on }));
      box.appendChild(row);
    }
  }
  for (const f of list) {
    const btn = document.querySelector(`.switch[data-id="${f.id}"]`);
    if (btn && fresh(f.id)) setSwitch(btn, f.on);
  }
}

/* ---------- Apps on the Overview ---------- */
const APP_ICONS = {
  "Discord": svg('<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>'),
  "Steam": ICONS.gamepad,
  "Windows Explorer": ICONS.folder,
  "CTF Loader": ICONS.keyboard,
};
const BOLT = '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>';
const appRows = {};

function renderApps(apps, total) {
  for (const a of apps) {
    let row = appRows[a.name];
    if (!row) {
      row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `<span class="ico" aria-hidden="true">${APP_ICONS[a.name] || ICONS.monitor}</span>
        <div class="txt"><div class="t"></div><div class="d"></div><div class="share"><i></i></div></div>
        <span class="ram"><span>0</span><small>MB</small></span>
        <button class="mini">${BOLT}</button>`;
      row.querySelector(".t").textContent = a.name;
      const btn = row.querySelector(".mini");
      btn.setAttribute("aria-label", "Trim " + a.name + " now");
      btn.title = "Trim " + a.name + " now";
      btn.addEventListener("click", () => {
        if (btn.classList.contains("busy")) return;
        btn.classList.add("busy");
        send({ cmd: "trim_now", app: a.name });
      });
      $("apps").appendChild(row);
      appRows[a.name] = row;
    }
    row.classList.toggle("off", !a.running);
    row.querySelector(".mini").disabled = !a.running;
    tween(row.querySelector(".ram span"), a.ramMb, int);
    const freed = a.freedMb >= 1 ? ` · ${sizeParts(a.freedMb).join(" ")} freed` : "";
    row.querySelector(".d").textContent = !a.running ? "Not running"
      : (a.auto ? "Auto-trim on" : "Auto-trim off") + freed;
    row.querySelector(".share i").style.width = `${total > 0 ? (a.ramMb / total) * 100 : 0}%`;
  }
}

/* ---------- Timing steppers ---------- */
const edited = {};
function buildTimings() {
  const box = $("timings");
  TIMINGS.forEach(([title, desc], i) => {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `<span class="ico" aria-hidden="true">${ICONS.clock}</span>
      <div class="txt"><div class="t"></div><div class="d"></div></div>
      <div class="stepper"><button aria-label="Less">&minus;</button><input type="number" min="1" max="86400" inputmode="numeric"><span class="s">sec</span><button aria-label="More">+</button></div>`;
    row.querySelector(".t").innerHTML = `<span></span><span class="saved">Saved</span>`;
    row.querySelector(".t span").textContent = title;
    row.querySelector(".d").textContent = desc;
    const input = row.querySelector("input");
    input.setAttribute("aria-label", title + " in seconds");
    input.id = "timing" + i;
    const saved = row.querySelector(".saved");
    let timer;
    const commit = () => {
      const v = Math.min(86400, Math.max(1, Math.round(Number(input.value) || 1)));
      input.value = v;
      edited[i] = Date.now();
      clearTimeout(timer);
      timer = setTimeout(() => {
        send({ cmd: "timing", index: i, value: v });
        saved.classList.add("show");
        setTimeout(() => saved.classList.remove("show"), 1400);
      }, 450);
    };
    const stepOf = (v) => (v < 60 ? 5 : v < 300 ? 15 : 60);
    const [less, more] = row.querySelectorAll(".stepper button");
    less.addEventListener("click", () => { const v = Number(input.value) || 1; input.value = v - stepOf(v - 1); commit(); });
    more.addEventListener("click", () => { const v = Number(input.value) || 1; input.value = v + stepOf(v); commit(); });
    input.addEventListener("change", commit);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") input.blur(); });
    box.appendChild(row);
  });
}

/* ---------- Tabs ---------- */
function showTab(name) {
  $("tabs").dataset.tab = name;
  for (const tab of ["overview", "settings"]) {
    $("tab-" + tab).setAttribute("aria-selected", tab === name ? "true" : "false");
    $(tab).hidden = tab !== name;
  }
}
$("tab-overview").addEventListener("click", () => showTab("overview"));
$("tab-settings").addEventListener("click", () => showTab("settings"));

/* ---------- Toast and particles ---------- */
let toastTimer;
function toast(text) {
  $("toastText").textContent = text;
  $("toast").classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("toast").classList.remove("show"), 2600);
}
function burst(el) {
  if (reduced) return;
  const r = el.getBoundingClientRect();
  const colors = [getComputedStyle(document.documentElement).getPropertyValue("--accent"),
                  getComputedStyle(document.documentElement).getPropertyValue("--accent-2"), "#ffffff"];
  for (let i = 0; i < 18; i++) {
    const p = document.createElement("span");
    p.className = "particle";
    p.style.background = colors[i % 3];
    p.style.left = r.left + r.width / 2 + "px";
    p.style.top = r.top + r.height / 2 + "px";
    document.body.appendChild(p);
    const a = Math.random() * Math.PI * 2, d = 50 + Math.random() * 80;
    p.animate([
      { transform: "translate(-50%,-50%) scale(1)", opacity: 1 },
      { transform: `translate(calc(-50% + ${Math.cos(a) * d}px), calc(-50% + ${Math.sin(a) * d - 20}px)) scale(.2)`, opacity: 0 },
    ], { duration: 700 + Math.random() * 400, easing: "cubic-bezier(.2,.8,.3,1)" }).onfinish = () => p.remove();
  }
}

/* ---------- Trim now ---------- */
$("trimBtn").addEventListener("click", () => {
  const btn = $("trimBtn");
  if (btn.classList.contains("busy")) return;
  btn.classList.add("busy");
  $("trimText").textContent = "Trimming";
  send({ cmd: "trim_now" });
});

$("autostartIco").innerHTML = ICONS.power;
wireSwitch($("autostart"), "autostart", (on) => send({ cmd: "autostart", on }));
$("updateBtn").addEventListener("click", () => send({ cmd: "update" }));
document.addEventListener("keydown", (e) => { if (e.key === "Escape") send({ cmd: "close" }); });
$("titlebar").addEventListener("mousedown", (e) => {
  if (e.button === 0 && !e.target.closest("button")) send({ cmd: "drag" });
});
$("minBtn").addEventListener("click", () => send({ cmd: "minimize" }));
$("closeBtn").addEventListener("click", () => send({ cmd: "close" }));
document.addEventListener("contextmenu", (e) => { if (!e.target.matches("input")) e.preventDefault(); });

/* ---------- State from the app ---------- */
window.dt = {
  update(s) {
    $("ver").textContent = "v" + s.version;
    document.body.classList.toggle("inactive", !s.active);
    const running = s.apps.filter((a) => a.running);
    const total = running.reduce((sum, a) => sum + a.ramMb, 0);
    $("status").classList.toggle("on", running.length > 0);
    $("statusText").textContent = `${running.length} of ${s.apps.length} apps running`;

    tween($("ram"), total, int);
    if (running.length) {
      history.push(total);
      if (history.length > SAMPLES) history.shift();
      peak = Math.max(peak, total);
    }
    // Only call out a real drop, not the MB-or-two wobble between samples.
    const below = peak - total;
    const dropped = running.length > 0 && below >= Math.max(10, peak * 0.03);
    const sub = $("ramSub");
    sub.classList.toggle("down", dropped);
    sub.textContent = !running.length ? "None of the tracked apps are running."
      : dropped ? `↓ ${int(below)} MB below this window's peak` : "Holding steady";
    drawChart();
    renderApps(s.apps, total);

    const [, unit] = sizeParts(s.freedMb);
    $("freedUnit").textContent = unit;
    tween($("freed"), s.freedMb, (v) => sizeParts(v)[0]);
    tween($("trims"), s.trims, int);

    renderFeatures(s.features);
    if (fresh("autostart")) setSwitch($("autostart"), s.autostart);
    s.timings.forEach((v, i) => {
      const input = $("timing" + i);
      if (input && document.activeElement !== input && (!edited[i] || Date.now() - edited[i] > 2000)) input.value = v;
    });

    $("update").hidden = !s.update;
    if (s.update) {
      $("updateText").textContent = `Version ${s.update} is ready`;
      $("updateBtn").textContent = s.downloading ? "Downloading" : "Install";
      $("updateBtn").disabled = s.downloading;
    }
  },
  // `app` is the app's name for a per-app trim, or null for "Trim all now".
  trimmed(mb, app) {
    const btn = app ? appRows[app]?.querySelector(".mini") : $("trimBtn");
    if (!btn) return;
    btn.classList.remove("busy");
    if (!app) $("trimText").textContent = "Trim all now";
    const where = app ? `from ${app}` : "across your apps";
    if (mb >= 1) {
      burst(btn);
      toast(`Freed ${sizeParts(mb).join(" ")} ${where}`);
    } else {
      toast(app ? `${app} is already lean` : "Everything is already lean");
    }
  },
};

buildTimings();
send({ cmd: "ready" });
</script>
</body>
</html>
